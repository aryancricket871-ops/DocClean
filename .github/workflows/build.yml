name: Build DocClean (APK + AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install Android SDK 36 and ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android project (gradle files, manifest, icons)
        run: |
          mkdir -p src/main/java/com/aryandigital/docclean
          mkdir -p src/main/res/drawable-nodpi src/main/res/drawable src/main/res/mipmap-anydpi-v26
          cp MainActivity.kt src/main/java/com/aryandigital/docclean/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DocClean"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1"
              id("org.jetbrains.kotlin.android") version "2.1.21"
          }

          val vc = System.getenv("VERSION_CODE")?.toIntOrNull() ?: 1

          android {
              namespace = "com.aryandigital.docclean"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.aryandigital.docclean"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = vc
                  versionName = "1.0.$vc"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "docclean"
                      keyPassword = System.getenv("KS_PASS")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0")
              implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.1")
              implementation("com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1")
          }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="DocClean"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="ocr,ocr_devanagari" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
          </shape>
          EOF

          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          # logo for the app screen, adaptive-icon foreground, and 512px Play Store icon
          convert logo.png -resize 600x600 src/main/res/drawable-nodpi/logo.png
          convert logo.png -resize 288x288 -background none -gravity center -extent 432x432 src/main/res/drawable-nodpi/ic_fg.png
          convert logo.png -background white -alpha remove -alpha off -resize 512x512 playstore-icon-512.png

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "NEW_KEY=false" >> "$GITHUB_ENV"
          else
            KS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore release.jks -storetype PKCS12 \
              -alias docclean -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS" -keypass "$KS" \
              -dname "CN=Aryan Digital Solutions, O=Aryan Digital Solutions, C=IN"
            mkdir -p keybackup
            cp release.jks keybackup/release.jks
            base64 -w0 release.jks > keybackup/KEYSTORE_BASE64.txt
            printf 'KEYSTORE_PASSWORD=%s\n' "$KS" > keybackup/KEYSTORE_PASSWORD.txt
            echo "KS_PASS=$KS" >> "$GITHUB_ENV"
            echo "NEW_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK + AAB + Play Store icon
        uses: actions/upload-artifact@v4
        with:
          name: DocClean-APK-AAB
          path: |
            build/outputs/apk/release/*.apk
            build/outputs/bundle/release/*.aab
            playstore-icon-512.png

      - name: Upload signing key backup (first run only)
        if: env.NEW_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-SAFE-signing-key
          path: keybackup/
          retention-days: 3
